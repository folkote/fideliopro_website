<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="restore-title restore-desc">
  <title id="restore-title">Archive to isolated database</title>
  <desc id="restore-desc">A preserved archive box connects to a restored database inside a separate dashed boundary. The conceptual drawing describes isolation and restoration without implying recovery speed or displaying customer data.</desc>
  <rect width="640" height="360" fill="#101d2b"/>
  <g fill="none" stroke="#8397a8" stroke-width="1.5" stroke-linejoin="miter">
    <path d="M54 283h226m74 0h232" opacity=".4"/>
    <path d="M62 76V60h36m480 0h-36m36 0v16" opacity=".55"/>
    <path d="M354 85h224v179H354Z" stroke-dasharray="6 7"/>
  </g>
  <!-- Archive sheets remain visible behind the closed storage box. -->
  <g fill="#101d2b" stroke="#8397a8" stroke-width="2" stroke-linejoin="miter">
    <path d="M114 139V88h105v51M126 127V76h105v63M138 115V64h105v75"/>
    <path d="M155 86h68m-68 13h48" stroke-width="1.5"/>
    <path d="M95 142h164v104H95Z" stroke="#dce5eb"/>
    <path d="M86 128h182v29H86Z" stroke="#dce5eb"/>
    <path d="M151 177h52v24h-52Z"/>
    <path d="M169 188h16" stroke="#dce5eb"/>
    <path d="M108 232h138" opacity=".5" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#65c6be" stroke-width="2" stroke-linejoin="miter">
    <path d="M269 185h54v-20h67m-8-7 8 7-8 7"/>
  </g>
  <!-- Conventional database vessel, kept inside the isolation envelope. -->
  <g fill="#101d2b" stroke="#dce5eb" stroke-width="2">
    <path d="M413 135v89c0 12 23 22 52 22s52-10 52-22v-89"/>
    <ellipse cx="465" cy="135" rx="52" ry="22"/>
    <path d="M413 164c0 12 23 22 52 22s52-10 52-22m-104 30c0 12 23 22 52 22s52-10 52-22" fill="none" stroke="#8397a8" stroke-width="1.5"/>
  </g>
  <path d="M447 135h36m-18-8v16" fill="none" stroke="#65c6be" stroke-width="2"/>
  <g fill="#101d2b" stroke="#65c6be" stroke-width="2" stroke-linejoin="miter">
    <path d="M496 225h35v29h-35Z"/>
    <path d="m505 239 6 6 12-13" fill="none"/>
  </g>
</svg>
